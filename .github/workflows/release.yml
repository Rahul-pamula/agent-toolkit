name: Release

# Sole automated PyPI publish path for version tags (v*).
# Manual TestPyPI/PyPI republish: workflow "Publish (manual)" only.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: create-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: |
          bash scripts/prepare-package-data.sh && uv build --package agent-toolkit-cli
          ls -lh dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  build-binaries:
    name: Build ${{ matrix.artifact }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, artifact: agent-toolkit-linux-x86_64}
          - {os: macos-latest, artifact: agent-toolkit-macos-arm64}
          - {os: windows-latest, artifact: agent-toolkit-windows-x86_64}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install package and PyInstaller
        run: |
          uv sync --package agent-toolkit-cli --extra all
          uv pip install pyinstaller
      - name: Build standalone binary
        shell: bash
        run: >-
          uv run --package agent-toolkit-cli pyinstaller --onefile --name agent-toolkit
          --add-data "skills:skills"
          --add-data "agents:agents"
          --add-data "loops:loops"
          --add-data "profiles:profiles"
          --add-data "mcp:mcp"
          --add-data "catalogs:catalogs"
          packages/agent-toolkit-cli/src/agent_toolkit/cli/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/agent-toolkit*
          retention-days: 7

  upload-assets:
    name: Attach binaries to release
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries/
          merge-multiple: true
      - run: gh release upload "${GITHUB_REF_NAME}" binaries/agent-toolkit* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate CycloneDX SBOM with syft
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-release-assets: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f sbom.cyclonedx.json ]; then
            gh release upload "${GITHUB_REF_NAME}" sbom.cyclonedx.json --clobber
          fi
